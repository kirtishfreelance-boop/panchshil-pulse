# Render Blueprint — Free Plan compatible.
#
# No `disk:` block anywhere: persistent disks require a paid instance type, and
# Render rejects the whole blueprint sync when one appears on a free service,
# which silently blocks every subsequent deploy.
#
# Persistence comes from Postgres instead, which the free plan does support.

databases:
  - name: pulse-db
    plan: free
    databaseName: pulse
    user: pulse
    region: singapore

services:
  - type: web
    name: panchshil-pulse-api
    runtime: node
    plan: free
    region: singapore # must match the database region
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Wired automatically from the database above — nothing to copy by hand.
      # To use Neon instead, delete this entry and set DATABASE_URL manually in
      # the dashboard to Neon's connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString

      - key: NODE_VERSION
        value: "22.20.0"

      - key: NODE_ENV
        value: production

      # Generated once and kept across deploys. Rotating it signs every
      # existing app session out.
      - key: JWT_SECRET
        generateValue: true

      # First administrator for /admin. Setting ADMIN_PASSWORD also resets the
      # owner password on the next deploy, so it doubles as password recovery.
      - key: ADMIN_EMAIL
        value: admin@panchshil.com
      - key: ADMIN_PASSWORD
        sync: false # set this yourself in the Render dashboard

      # OTP delivery. "console" logs the code and returns it in the API
      # response for testing. Set to "msg91" or "twilio" and add the matching
      # credentials below to send real SMS; echoing then stops automatically.
      - key: SMS_PROVIDER
        value: console
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
