# Render Blueprint — Free Plan compatible.
#
# Deliberately contains no `disk:` block. Persistent disks require a paid
# instance type, and Render rejects the entire blueprint sync when one appears
# on a free service — which silently blocks every subsequent deploy.
#
# Consequence: the filesystem is ephemeral. The SQLite database is recreated on
# each deploy and the API re-seeds itself on boot, so demo content always comes
# back but data created during testing does not survive a redeploy.
#
# To get persistence, change `plan: free` to `plan: starter` and add:
#   disk:
#     name: pulse-data
#     mountPath: /var/data
#     sizeGB: 1
# then set PULSE_DB=/var/data/pulse.db.

services:
  - type: web
    name: panchshil-pulse-api
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # node:sqlite is only available from Node 22.5; Render's default is older.
      - key: NODE_VERSION
        value: "22.20.0"

      - key: NODE_ENV
        value: production

      # Generated once and kept across deploys. Rotating it signs every
      # existing app session out.
      - key: JWT_SECRET
        generateValue: true

      # First administrator for /admin. Setting this also resets the owner
      # password on the next deploy, so it doubles as password recovery.
      - key: ADMIN_EMAIL
        value: admin@panchshil.com
      - key: ADMIN_PASSWORD
        sync: false # set this yourself in the Render dashboard

      # OTP delivery. "console" logs the code and returns it in the API
      # response for testing. Set to "msg91" or "twilio" and add the matching
      # credentials below to send real SMS; echoing then stops automatically.
      - key: SMS_PROVIDER
        value: console
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
