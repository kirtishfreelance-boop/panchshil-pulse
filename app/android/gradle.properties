org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project lives on D: while the Dart pub cache is on C:. Kotlin's incremental
# compiler relativizes source paths against the cache directory and throws
# "this and base files have different roots" when they sit on different drives.
# Turning incremental compilation off sidesteps it; full builds are slightly
# slower but correct.
kotlin.incremental=false
